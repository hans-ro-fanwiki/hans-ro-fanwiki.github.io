name: Official source drift check
on:
  schedule:
    - cron: "19 20 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: official-source-watch
  cancel-in-progress: true
jobs:
  compare-hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node scripts/check-official.mjs
